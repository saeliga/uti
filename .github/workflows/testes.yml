# Testes automáticos a cada pull request e a cada mudança no main:
# 1) regras do sistema (node --test testes/);
# 2) regras de segurança do Firestore no simulador oficial (testes-regras/), com contas fictícias.
# Nenhum dado real é usado: o simulador roda vazio, só com dados de teste.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar ferramentas de teste
        run: npm install --no-audit --no-fund
      - name: Testes das regras do sistema
        run: npm test
      - name: Testes das regras do Firestore (simulador)
        run: npm run test:regras
