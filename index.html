  <div id="app"><div class="carregando"><span class="giro" aria-hidden="true"></span>Carregando…</div></div>
  <noscript>Este sistema precisa de JavaScript ativado.</noscript>
  <script>
    // Se os arquivos do sistema não carregarem (cache antigo depois de uma atualização,
    // ou conexão ruim), mostra um botão para recarregar em vez de ficar só "Carregando…".
    setTimeout(function () {
      if (window.__sistemaCarregado) return;
      var app = document.getElementById('app');
      app.innerHTML = '<div class="carregando" style="flex-direction:column;gap:12px;text-align:center;padding:40px 16px">' +
        '<p>O sistema não terminou de carregar. Pode ser a conexão ou uma versão antiga guardada pelo navegador.</p>' +
        '<button class="btn btn-primario" type="button" id="recarregar-sistema">Recarregar</button></div>';
      document.getElementById('recarregar-sistema').onclick = function () {
        var u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u.toString());
      };
    }, 12000);
  </script>
